        <div class="container">

                <div class="contact-info">
                    <img src="chicos.png" alt="Descripción de la imagen" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="contact-info-form"> <span class="circle one"></span> <span class="circle two"></span>
                   
                        <form action="login.php" method="POST" onclick="return false;" autocomplete="off">

        	<!-- VENTANA  CREAR CUENTA -->
            <div id="ventana1" class="ventana">
                <!-- Contenido del modal -->
                <div class="contenidoVentana">
                        <div class="rotulo"> 
                            <!-- &times; representa una x -->
                        
                            <span class="close" id="closeVentana1">&times;</span>
                            <p class="fondoOlvido">Si has olvidado tu contraseña puedes crear una nueva proporcionando tu matrícula. 
                                Se te enviará un correo electrónico con un vínculo para cambiar tu contraseña a 
                                tu dirección registrada. Haz clic en el enlace y te llevará a una página donde 
                                podrás crear la nueva contraseña</p>
                             <input type="text" name="name" id="matriculaRecu" class="matricula" placeholder="Matricula" /> 
                             <input type="button" id="" value="Enviar enlace"  class="boton">  
                             <input type="button" id="" value="Cancelar"  class="boton" onclick="limpiarCampos2()"> 
                        </div>       
                          
                         
                </div>
            </div>
        
            <!-- FIN VENTANA CREAR CUENTA -->       
       
        <script>
            function limpiarCampos() {
                document.getElementById('matricula').value = '';
                document.getElementById('password').value = '';
            }  
            function limpiarCampos2() {
                document.getElementById('matriculaRecu').value = '';
            }
    
            // Mostrar ventana emergente
            document.getElementById('openVentana1').onclick = function() {
                document.getElementById('ventana1').style.display = 'flex';
            }
    
            // Ocultar ventana emergente
            document.getElementById('closeVentana1').onclick = function() {
                document.getElementById('ventana1').style.display = 'none';
            }
    
            // Ocultar ventana emergente al hacer clic fuera de ella
            window.onclick = function(event) {
                if (event.target == document.getElementById('ventana1')) {
                    document.getElementById('ventana1').style.display = 'none';
                }
            }
        </script>
